<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <title>NovelAI Prompt Editor</title>
  <link rel="stylesheet" href="lib/style.css">
  <style>
    /* Popup specific overrides */
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #1e1e2e;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100%;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 12px;
      background: #2a2a3e;
      border-bottom: 1px solid #4a4a6a;
      flex-shrink: 0;
    }

    .tabs {
      display: flex;
      gap: 4px;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: #999;
      padding: 4px 10px;
      cursor: pointer;
      font-weight: bold;
      border-radius: 4px;
      transition: all 0.2s;
      font-size: 13px;
    }

    .tab-btn:hover {
      background: rgba(255, 255, 255, 0.05);
      color: #ddd;
    }

    .tab-btn.active {
      background: #4a4a6a;
      color: #fff;
    }

    .controls {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      background: transparent;
      border: 1px solid #4a4a6a;
      color: #ccc;
      width: 28px;
      height: 28px;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1em;
    }

    .icon-btn:hover {
      background: #4a4a6a;
    }

    #editor-container {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      background: #181825;
    }

    #input-area {
      padding: 4px 10px;
      background: #2a2a3e;
      border-bottom: 1px solid #4a4a6a;
      display: flex;
      gap: 6px;
      flex-shrink: 0;
      align-items: center;
    }

    #quick-input, .char-quick-input {
      flex: 1;
      height: 24px;
      /* Slightly adjusted for standard input feel */
      background: #181825;
      border: 1px solid #4a4a6a;
      color: #fff;
      border-radius: 4px;
      padding: 0 10px;
      /* Vertical padding 0 for native centering in input */
      font-size: 13px;
      line-height: normal;
      outline: none;
      transition: border-color 0.2s;
      display: flex;
      align-items: center;
    }

    #quick-input:focus, .char-quick-input:focus {
      border-color: #818cf8;
    }

    .quick-btn {
      background: #3a3a55;
      color: #ccc;
      border: 1px solid #4a4a6a;
      border-radius: 4px;
      padding: 0 6px;
      height: 24px;
      cursor: pointer;
      font-weight: bold;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .quick-btn:hover {
      background: #4a4a6a;
    }

    #btn-add, .primary-add-btn {
      background: #818cf8;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 0 12px;
      height: 24px;
      cursor: pointer;
      font-weight: bold;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #btn-add:hover, .primary-add-btn:hover {
      background: #6366f1;
    }

    /* Settings Modal */
    #settings-modal {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background: #2a2a3e;
      padding: 20px;
      border-radius: 8px;
      width: 80%;
      max-height: 80%;
      overflow-y: auto;
      border: 1px solid #4a4a6a;
    }

    .setting-group {
      margin-bottom: 15px;
    }

    .setting-group label {
      display: block;
      margin-bottom: 5px;
      cursor: pointer;
    }

    .setting-desc {
      font-size: 0.8em;
      color: #999;
      margin-left: 20px;
    }

    h3 {
      margin-top: 0;
      border-bottom: 1px solid #4a4a6a;
      padding-bottom: 8px;
    }
  </style>
</head>

<body>
  <div id="app">
    <header>
      <div class="tabs">
        <button id="tab-positive" class="tab-btn active" data-i18n="tab_positive">Prompt</button>
        <button id="tab-negative" class="tab-btn" data-i18n="tab_negative">Undesired Content</button>
      </div>
      <div class="controls">
        <span id="sync-status" data-i18n="status_ready"
          style="font-size:0.8em; color:#666; margin-right:8px; display:flex; align-items:center;">Ready</span>
        <button id="btn-library" class="icon-btn" title="Resource Center" data-i18n-title="btn_library">📚</button>
        <button id="btn-settings" class="icon-btn" title="Settings" data-i18n-title="btn_settings">⚙️</button>
      </div>
    </header>

    <div id="input-area">
      <input id="quick-input" type="text" placeholder="Enter tags here..." data-i18n-placeholder="input_placeholder">
      <button id="btn-quick-wildcard" class="quick-btn" title="Wildcard" data-i18n-title="btn_quick_wildcard">随机抽取</button>
      <button id="btn-quick-seq-wildcard" class="quick-btn" title="Sequential Wildcard" data-i18n-title="btn_quick_seq_wildcard">顺序抽取</button>
      <button id="btn-quick-random" class="quick-btn" title="Random Choice" data-i18n-title="btn_quick_random">动态抽取</button>
      <button id="btn-add" class="primary-add-btn" data-i18n="btn_add">Add</button>
    </div>

    <div id="editor-container">
      <!-- Initial loading state -->
      <div id="loading-text" style="text-align:center; padding-top:50px; color:#666;" data-i18n="loading">
        Connecting to NovelAI...
      </div>
    </div>

    <!-- Panel Resizer -->
    <div id="resizer"></div>

    <!-- Character Prompts Section -->
    <div id="character-prompts-section">
      <div class="char-section-header">
        <span class="char-title" data-i18n="char_title">Character Prompts</span>
        <button id="btn-add-char" class="quick-btn" style="display:block;" data-i18n="btn_add_char">+ Add Character</button>
      </div>
      <div id="char-list-container"></div>
    </div>
  </div>

  <template id="char-prompt-template">
    <div class="char-prompt-block">
      <div class="char-input-area">
        <div class="char-pn-toggle">
          <button class="char-pn-btn active char-tab-pos" title="Positive Prompts">+</button>
          <button class="char-pn-btn char-tab-neg" title="Undesired Content">-</button>
        </div>
        <input type="text" class="char-quick-input" placeholder="Enter tags here...">
        <button class="quick-btn char-btn-wildcard" title="Wildcard">随机抽取</button>
        <button class="quick-btn char-btn-seq-wildcard" title="Sequential Wildcard">顺序抽取</button>
        <button class="quick-btn char-btn-random" title="Random Choice">动态抽取</button>
        <button class="primary-add-btn">Add</button>
        <button class="char-delete" title="Remove Character">×</button>
      </div>
      <div class="char-editor-container">
        <!-- Tag Editor mounts here -->
      </div>
    </div>
  </template>

  <div id="settings-modal">
    <div class="modal-content">
      <h3 data-i18n="settings_title">Settings <button id="close-settings"
          style="float:right; background:transparent; border:none; color:#ccc; cursor:pointer;">×</button></h3>

      <!-- Existing Settings -->
      <div class="setting-group">
        <label><input type="checkbox" id="preservePrompt" checked> <span data-i18n="setting_preserve">Preserve Original
            img prompts on Enhance</span></label>
        <div class="setting-desc" data-i18n="setting_preserve_desc">Uncheck this to randomize enhance prompts.</div>
      </div>
      <div class="setting-group">
        <label><input type="checkbox" id="alternativeDanbooruAutocomplete"> <span
            data-i18n="setting_alt_autocomplete">Full Alternative Danbooru Autocomplete</span></label>
        <div class="setting-desc" data-i18n="setting_alt_autocomplete_desc">a1111 WebUI style Danbooru Autocomplete.
        </div>
      </div>
      <div class="setting-group">
        <label><input type="checkbox" id="renderNewlines"> <span data-i18n="setting_render_newlines">Render Real
            Newlines</span></label>
        <div class="setting-desc" data-i18n="setting_render_newlines_desc">Force actual line breaks in the UI at newline
          tags.
        </div>
      </div>
      <div class="setting-group">
        <strong data-i18n="setting_trigger_keys">Trigger Keys:</strong>
        <label><input type="checkbox" id="triggerSpace" checked> <span data-i18n="setting_space">Space</span></label>
        <label><input type="checkbox" id="triggerTab"> <span data-i18n="setting_tab">Tab</span></label>
      </div>


      <div style="text-align:right;">
        <div id="langToggle">
          <button id="btn-en">EN</button>
          <button id="btn-jp">JP</button>
          <button id="btn-zh">中文</button>
        </div>
      </div>

      <style>
        #langToggle {
          margin-top: 15px;
        }

        #langToggle button {
          background: #3a3a55;
          color: #ccc;
          border: 1px solid #4a4a6a;
          padding: 4px 10px;
          border-radius: 4px;
          cursor: pointer;
          font-size: 0.8em;
          margin-left: 4px;
        }

        #langToggle button:hover {
          background: #4a4a6a;
        }

        #langToggle button.active {
          background: #818cf8;
          color: #fff;
          border-color: #6366f1;
        }
      </style>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>

</html>
