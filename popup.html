<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <title>NovelAI Prompt Editor</title>
  <link rel="stylesheet" href="lib/style.css">
  <style>
    /* Popup specific overrides */
    body {
      width: 600px;
      height: 500px;
      margin: 0;
      padding: 0;
      background: #1e1e2e;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: #2a2a3e;
      border-bottom: 1px solid #4a4a6a;
    }

    .tabs {
      display: flex;
      gap: 4px;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: #999;
      padding: 6px 12px;
      cursor: pointer;
      font-weight: bold;
      border-radius: 4px;
      transition: all 0.2s;
    }

    .tab-btn:hover {
      background: rgba(255, 255, 255, 0.05);
      color: #ddd;
    }

    .tab-btn.active {
      background: #4a4a6a;
      color: #fff;
    }

    .controls {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      background: transparent;
      border: 1px solid #4a4a6a;
      color: #ccc;
      width: 32px;
      height: 32px;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2em;
    }

    .icon-btn:hover {
      background: #4a4a6a;
    }

    #editor-container {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      background: #181825;
    }

    #input-area {
      padding: 8px 12px;
      background: #2a2a3e;
      border-top: 1px solid #4a4a6a;
      display: flex;
      gap: 8px;
    }

    #quick-input {
      flex: 1;
      height: 36px;
      background: #181825;
      border: 1px solid #4a4a6a;
      color: #fff;
      border-radius: 4px;
      padding: 6px;
      resize: none;
    }

    #btn-add {
      background: #818cf8;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 0 16px;
      cursor: pointer;
      font-weight: bold;
    }

    #btn-add:hover {
      background: #6366f1;
    }

    /* Settings Modal */
    #settings-modal {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background: #2a2a3e;
      padding: 20px;
      border-radius: 8px;
      width: 80%;
      max-height: 80%;
      overflow-y: auto;
      border: 1px solid #4a4a6a;
    }

    .setting-group {
      margin-bottom: 15px;
    }

    .setting-group label {
      display: block;
      margin-bottom: 5px;
      cursor: pointer;
    }

    .setting-desc {
      font-size: 0.8em;
      color: #999;
      margin-left: 20px;
    }

    h3 {
      margin-top: 0;
      border-bottom: 1px solid #4a4a6a;
      padding-bottom: 8px;
    }
  </style>
</head>

<body>
  <div id="app">
    <header>
      <div class="tabs">
        <button id="tab-positive" class="tab-btn active">Prompt</button>
        <button id="tab-negative" class="tab-btn">Undesired Content</button>
      </div>
      <div class="controls">
        <span id="sync-status"
          style="font-size:0.8em; color:#666; margin-right:8px; display:flex; align-items:center;">Ready</span>
        <button id="btn-sync" class="icon-btn" title="Sync now">⚡</button>
        <button id="btn-settings" class="icon-btn" title="Settings">⚙️</button>
      </div>
    </header>

    <div id="editor-container">
      <!-- Initial loading state -->
      <div style="text-align:center; padding-top:50px; color:#666;">
        Connecting to NovelAI...
      </div>
    </div>

    <div id="input-area">
      <textarea id="quick-input" placeholder="Enter tags here..."></textarea>
      <button id="btn-add">Add</button>
    </div>
  </div>

  <div id="settings-modal">
    <div class="modal-content">
      <h3>Settings <button id="close-settings"
          style="float:right; background:transparent; border:none; color:#ccc; cursor:pointer;">×</button></h3>

      <!-- Existing Settings -->
      <div class="setting-group">
        <label><input type="checkbox" id="preservePrompt" checked> Preserve Original img prompts on Enhance</label>
        <div class="setting-desc">Uncheck this to randomize enhance prompts.</div>
      </div>
      <div class="setting-group">
        <label><input type="checkbox" id="alternativeDanbooruAutocomplete"> Full Alternative Danbooru
          Autocomplete</label>
        <div class="setting-desc">a1111 WebUI style Danbooru Autocomplete.</div>
      </div>
      <div class="setting-group">
        <strong>Trigger Keys:</strong>
        <label><input type="checkbox" id="triggerSpace" checked> Space</label>
        <label><input type="checkbox" id="triggerTab"> Tab</label>
      </div>

      <!-- Local Sync -->
      <div class="setting-group" style="border-top:1px solid #4a4a6a; padding-top:10px;">
        <strong>Local Sync</strong>
        <div id="localSyncStatus" style="font-size:0.9em; margin:5px 0;">Not linked</div>
        <button id="openSyncPageBtn" style="padding:4px 8px;">Open Sync Manager</button>
      </div>

      <div style="text-align:right;">
        <div id="langToggle">
          <button id="btn-en">EN</button>
          <button id="btn-jp">JP</button>
          <button id="btn-zh">中文</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>

</html>
