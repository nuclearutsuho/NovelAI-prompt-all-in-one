<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Group Tags Panel</title>
  <style>
    /* CSS Variables for Dynamic Density Control */
    :root {
      --density-gap: 2px;
      --density-pad-v: 6px;
      --density-pad-h: 8px;
      --density-tab-pad-v: 2px;
      --density-tab-pad-h: 8px;
      --density-font-tab: 11px;
      
      --density-card-pad-v: 1px;
      --density-card-pad-h: 4px;
      --density-font-zh: 10px;
      --density-font-en: 11px;
      
      --density-grid-pad: 8px;
    }

    /* Reset & Base */
    body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      background: #1e1e2e;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      border: 1px solid #4a4a6a;
      box-sizing: border-box;
      border-radius: 8px; /* Applied to the container when injected, but good for local dev */
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
    }


    /* Tabs Area (Dual Layer) */
    .tabs-container {
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    /* Primary Categories (Layer 1) */
    .primary-tabs {
      display: flex;
      gap: var(--density-gap);
      padding: var(--density-pad-v) var(--density-pad-h);
      background: #1e1e2e;
      border-bottom: 1px solid #3a3a55;
      overflow-x: auto;
    }

    /* Secondary Groups (Layer 2) */
    .secondary-tabs {
      display: flex;
      gap: var(--density-gap);
      padding: calc(var(--density-pad-v) - 2px) var(--density-pad-h);
      background: #252538;
      border-bottom: 1px solid #4a4a6a;
      overflow-x: auto;
    }

    /* Hide scrollbar for tabs */
    .primary-tabs::-webkit-scrollbar,
    .secondary-tabs::-webkit-scrollbar {
      height: 4px;
    }
    .primary-tabs::-webkit-scrollbar-thumb,
    .secondary-tabs::-webkit-scrollbar-thumb {
      background: #4a4a6a;
      border-radius: 2px;
    }

    .tab-btn {
      background: #181825;
      border: 1px solid #3a3a55;
      color: #999;
      padding: var(--density-tab-pad-v) var(--density-tab-pad-h);
      cursor: pointer;
      font-weight: 500;
      border-radius: 4px;
      transition: all 0.2s;
      font-size: var(--density-font-tab);
      white-space: nowrap;
    }

    .tab-btn:hover {
      background: #2a2a3e;
      color: #ddd;
    }

    .tab-btn.active {
      background: #818cf8;
      color: #fff;
      border-color: #6366f1;
    }

    .secondary-tabs .tab-btn {
      padding: calc(var(--density-tab-pad-v) - 1px) calc(var(--density-tab-pad-h) - 2px);
      font-size: calc(var(--density-font-tab) - 1px);
      border-radius: 3px;
    }

    .secondary-tabs .tab-btn.active {
      background: #4a4a6a;
      border-color: #818cf8;
    }
    
    .add-tab-btn {
      background: transparent;
      color: #818cf8;
      border: 1px dashed #4a4a6a;
      font-weight: bold;
    }
    .add-tab-btn:hover {
      background: rgba(129, 140, 248, 0.1);
      border-color: #818cf8;
    }

    /* Grid Area for Tags */
    .tags-grid-container {
      flex: 1;
      padding: var(--density-grid-pad);
      overflow-y: auto;
      background: #181825;
    }

    .tags-grid {
      display: flex;
      flex-wrap: wrap;
      gap: calc(var(--density-gap) * 2);
    }

    /* Tag Card */
    .tag-card {
      background: #181825;
      border: 1px solid #4a4a6a;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      transition: all 0.2s;
      user-select: none;
      position: relative;
      overflow: hidden;
      max-width: 120px; /* 动态宽度上限 */
      min-width: 50px; /* 防止过窄 */
    }

    .tag-card:hover {
      border-color: #818cf8;
      transform: translateY(-1px);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    .tag-card:active {
      transform: translateY(0);
    }

    /* Grayscale Filter for "used" tags */
    .tag-card.used {
      filter: grayscale(1) opacity(0.6);
      cursor: default; /* Optional: if you still want hover effect for removing */
    }

    /* 在另一侧输入框中使用的标签 */
    .tag-card.used-other {
      filter: grayscale(0.5) opacity(0.4);
      cursor: not-allowed;
      position: relative;
    }
    .tag-card.used-other::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 5%;
      right: 5%;
      height: 2px;
      background: #ff5555; /* 使用红色或亮色使其更明显 */
      opacity: 0.9;
      transform: translateY(-50%);
      pointer-events: none;
      z-index: 10;
      box-shadow: 0 0 3px rgba(0,0,0,0.5); /* 增加阴影，更像真实的删除线 */
    }

    /* Upper Half (Chinese / Localized) */
    .tag-zh-part {
      font-size: var(--density-font-zh);
      color: #fff;
      font-weight: 500;
      padding: var(--density-card-pad-v) var(--density-card-pad-h);
      text-align: center;
      /* Background will be set dynamically via JS from group color */
      background: #4a4a6a; 
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Lower Half (English / Original) */
    .tag-en-part {
      font-size: var(--density-font-en);
      font-weight: bold;
      color: #e0e0e0;
      padding: calc(var(--density-card-pad-v) + 1px) var(--density-card-pad-h);
      text-align: center;
      background: #2a2a3e;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Bottom Toolbar */
    .toolbar {
      padding: 4px 8px;
      background: #2a2a3e;
      border-top: 1px solid #4a4a6a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .color-picker-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #ccc;
    }

    input[type="color"] {
      -webkit-appearance: none;
      appearance: none;
      border: none;
      width: 24px;
      height: 24px;
      border-radius: 4px;
      cursor: pointer;
      padding: 0;
      background: transparent;
    }
    input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }
    input[type="color"]::-webkit-color-swatch {
      border: 1px solid #4a4a6a;
      border-radius: 4px;
    }
    
    /* 目标指示器 */
    .target-indicator {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: #aaa;
      background: rgba(255,255,255,0.05);
      padding: 2px 8px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.1);
      transition: all 0.3s ease;
      white-space: nowrap;
    }
    .target-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
      flex-shrink: 0;
      animation: pulse-dot 2s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
      50% { opacity: 0.7; box-shadow: 0 0 0 3px rgba(16, 185, 129, 0); }
    }
    .target-label {
      font-weight: 500;
      color: #ccc;
    }

    .toolbar-actions {
       display: flex;
       gap: 6px;
    }
    
    .action-btn {
      background: #3a3a55;
      color: #ccc;
      border: 1px solid #4a4a6a;
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 11px;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    .action-btn:hover {
      background: #4a4a6a;
      color: #fff;
    }

    /* Density Slider */
    .density-control {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #999;
      font-size: 11px;
    }
    .density-slider {
      width: 60px;
      height: 4px;
      -webkit-appearance: none;
      appearance: none;
      background: #4a4a6a;
      border-radius: 2px;
      outline: none;
    }
    .density-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #818cf8;
      cursor: pointer;
    }
    .density-slider::-webkit-slider-thumb:hover {
      background: #6366f1;
    }

  </style>
</head>
<body>
  <div id="app">

    <!-- Navigation Tabs -->
    <div class="tabs-container">
      <!-- Layer 1: Categories -->
      <div class="primary-tabs" id="primary-tabs-container">
        <!-- 动态渲染区 -->
        <button class="tab-btn add-tab-btn" id="btn-add-category" title="Add Category">+</button>
      </div>

      <!-- Layer 2: Groups -->
      <div class="secondary-tabs" id="secondary-tabs-container">
        <!-- 动态渲染区 -->
        <button class="tab-btn add-tab-btn" id="btn-add-group" title="Add Group">+</button>
      </div>
    </div>

    <!-- Tags Matrix Grid -->
    <div class="tags-grid-container">
      <div class="tags-grid" id="tags-grid">
        <!-- 动态渲染的卡片将被放在这里 -->
      </div>
    </div>

    <!-- Bottom Toolbar (Color Coding & Group Actions) -->
    <div class="toolbar">
      <div class="color-picker-wrapper">
        <label for="group-color" data-i18n="group_color">Group Color:</label>
        <input type="color" id="group-color" value="#10b981" title="Set background color for this group">
        <button class="action-btn" id="btn-reset-color" title="Reset Color">↺</button>
      </div>
      
      <!-- 目标指示器：显示当前标签将被追加到哪个编辑器 -->
      <div class="target-indicator" id="target-indicator">
        <span class="target-dot"></span>
        <span class="target-label" id="target-label">Base (+)</span>
      </div>

      <div class="toolbar-actions">
         <div class="density-control" title="Adjust Display Density">
           <span>🔍</span>
           <input type="range" id="density-slider" class="density-slider" min="0" max="100" value="50">
         </div>
         <button class="action-btn" id="btn-edit-group" data-i18n="btn_edit">Edit Group</button>
      </div>
    </div>
  </div>

  <script src="../modules/GroupTagsPanel.js"></script>
</body>
</html>
