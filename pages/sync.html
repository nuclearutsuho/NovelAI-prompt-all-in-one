                    <button id="batchDeleteBtn" class="btn-sm btn-danger" disabled data-i18n="batch_delete">🗑️ 批量删除</button>
                    <button id="batchExportBtn" class="btn-sm" disabled data-i18n="batch_export">💾 批量导出</button>
                    <div style="flex:1"></div>
                    <button id="snapshotSettingsBtn" class="btn-sm" title="快照设置" data-i18n-title="snapshot_settings_title" data-i18n="snapshot_settings">⚙️ 设置</button>
                </div>
                <div style="flex:1; overflow-y:auto">
                    <ul class="snapshot-list" id="snapshotList"></ul>
                    <div id="noSnapshots" style="color:#666; text-align:center; padding:16px;" data-i18n="no_snapshots">暂无快照</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Snapshots Settings Modal -->
    <div id="snapSettingsModal" class="modal">
        <div class="modal-content" style="width: 300px;">
            <h3 style="margin-top:0" data-i18n="snapshot_settings_title">快照设置</h3>
            <div style="margin: 16px 0;">
                <label style="display:flex; align-items:center; margin-bottom:12px;">
                    <span style="flex:1" data-i18n="snapshot_keep_count">快照保留数量:</span>
                    <input type="number" id="settingMaxSnapshots" min="1" max="100"
                        style="width:60px; padding:4px; background:#222238; color:#fff; border:1px solid #3a3a55; border-radius:4px;">
                </label>
                <label style="display:flex; align-items:center; cursor:pointer;">
                    <input type="checkbox" id="settingConfirmDelete" style="margin-right:8px;"> <span data-i18n="snapshot_confirm_delete">删除快照时确认</span>
                </label>
            </div>
            <div class="modal-actions">
                <button id="saveSnapSettingsBtn" class="btn-primary" data-i18n="action_save_plain">保存</button>
                <button id="closeSnapSettingsBtn" class="btn" data-i18n="action_cancel">取消</button>
            </div>
        </div>
    </div>

    <!-- Diff Modal -->
    <div id="diffModal" class="modal">
        <div class="modal-content" style="width: 800px; max-width:95%; height: 80vh;">
            <h3 style="margin-top:0; margin-bottom:10px;" data-i18n="diff_title">快照对比</h3>
            <div id="diffSummary" style="margin-bottom: 10px; font-weight: bold; font-size:0.9rem;"></div>
            <div id="diffContainer"
                style="flex: 1; overflow: auto; border: 1px solid #2a2a44; background: #0f0f1a; padding: 10px; font-family: monospace; font-size: 0.85rem; white-space: pre-wrap;">
            </div>
            <div class="modal-actions">
                <button id="closeDiffBtn" class="btn" data-i18n="action_close">关闭</button>
            </div>
        </div>
    </div>

    <!-- Custom Prompt Modal -->
    <div class="modal" id="promptModal">
        <div class="modal-content" style="width: 380px;">
            <h3 style="margin-top:0" id="promptTitle" data-i18n="prompt_title_input">输入</h3>
            <input type="text" id="promptInput"
                style="width:100%; padding:8px 12px; background:#222238; color:#d4d4e0; border:1px solid #3a3a55; border-radius:6px; font-size:0.9rem; margin-top:8px;"
                placeholder="">
            <div class="modal-actions">
                <button id="promptOkBtn" class="btn-primary" data-i18n="action_confirm">确认</button>
                <button id="promptCancelBtn" class="btn" data-i18n="action_cancel">取消</button>
            </div>
        </div>
    </div>



    <!-- Confirm Modal -->
    <div class="modal-overlay" id="confirmModal">
        <div class="modal-box">
            <p id="confirmMessage"></p>
            <div class="modal-actions">
                <button id="confirmYes" class="btn-danger" data-i18n="action_confirm">确认</button>
                <button id="confirmNo" data-i18n="action_cancel">取消</button>
            </div>
        </div>
    </div>

    </div>

    <!-- Sync Settings Popover (Body Level) -->
    <div id="syncQuickPopover" class="sync-quick-popover">
        <div class="popover-header" data-i18n="sync_debounce_time">自动同步防抖时间 (秒):</div>
        <div class="popover-control">
            <input type="range" id="settingSyncDebounceRange" min="1" max="60" step="1">
            <div class="popover-val">
                <input type="number" id="settingSyncDebounceInput" min="1" max="60">
                <span>s</span>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../lib/codemirror-bundle.js"></script>
    <script src="../lib/group-tags-data.js"></script>
    <script type="module" src="sync.js"></script>
</body>

</html>
